plugins {
    id 'com.android.application' version '9.1.0'
}

android {
    namespace 'com.unofficial.southparktv'
    compileSdk { version = release(36) { minorApiLevel = 1 } }
    defaultConfig {
        applicationId 'com.unofficial.southparktv'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.6.1'
    }
    signingConfigs {
        release {
            if (System.getenv('SPTV_KEYSTORE')) {
                storeFile file(System.getenv('SPTV_KEYSTORE'))
                storePassword System.getenv('SPTV_STORE_PASSWORD')
                keyAlias System.getenv('SPTV_KEY_ALIAS')
                keyPassword System.getenv('SPTV_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    def media3 = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-exoplayer-ima:$media3"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}

tasks.configureEach {
    if (name == 'validateSigningRelease') {
        doFirst {
            ['SPTV_KEYSTORE', 'SPTV_STORE_PASSWORD', 'SPTV_KEY_ALIAS', 'SPTV_KEY_PASSWORD'].each {
                if (!System.getenv(it)) throw new GradleException("Missing release signing environment: " + it)
            }
        }
    }
}
